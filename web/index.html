<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diskmap</title>
<link rel="stylesheet" href="style.css">
<script>window.DISKMAP_TOKEN = "{{TOKEN}}";</script>
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <button id="up" class="icon" aria-label="Up one folder">
    <svg viewBox="0 0 24 24"><path d="M12 5l-7 7h4v7h6v-7h4z"/></svg>
  </button>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <div id="progress" role="status" aria-label="Scan progress">
    <span id="spin" class="spin" aria-hidden="true"></span>
    <svg id="ok" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9 16.2l-4.2-4.2-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    <span id="pfiles" aria-label="Files counted"></span>
    <span id="pbytes" aria-label="Bytes found"></span>
    <span id="ptime" aria-label="Scan time"></span>
  </div>
  <div id="sel" aria-label="Selection" hidden>
    <span id="selcount" aria-label="Selected items"></span>
    <span id="selsize" aria-label="Selected size"></span>
    <button id="clear" class="icon" aria-label="Clear selection">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </button>
    <button id="del" class="icon danger" aria-label="Delete selection">
      <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>
    </button>
  </div>
</header>
<main>
  <section id="list" aria-label="Biggest first">
    <table>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <section id="mapwrap" aria-label="Treemap">
    <canvas id="map"></canvas>
    <div id="tip" role="tooltip" hidden></div>
  </section>
</main>
<dialog id="confirm" aria-label="Confirm delete">
  <ul id="clist"></ul>
  <div class="total"><span id="ctotal" aria-label="Total size"></span></div>
  <div class="actions">
    <button id="cancel" class="icon" aria-label="Cancel" autofocus>
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </button>
    <button id="perm" class="icon danger" aria-label="Delete permanently">
      <svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 01-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z"/></svg>
    </button>
    <button id="dotrash" class="icon accent" aria-label="Move to trash">
      <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>
    </button>
  </div>
</dialog>
<dialog id="results" aria-label="Delete results">
  <ul id="rlist"></ul>
  <div class="actions">
    <button id="rclose" class="icon" aria-label="Close" autofocus>
      <svg viewBox="0 0 24 24"><path d="M9 16.2l-4.2-4.2-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    </button>
  </div>
</dialog>
</body>
</html>
